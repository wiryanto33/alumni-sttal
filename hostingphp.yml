project_name: alumni
framework: laravel
database:
  name: alumni_sttal
  user: alumni_sttal
  password: tamtama33
  host: localhost
  port: 3306
  auto_migrate: true
  create_user: true
commands:
  # Ensure dependencies are installed before any artisan calls
  - "composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader"

  # Build frontend assets only if your server has Node; otherwise remove this
  - "npm run production"

  # Run database migrations
  - "php artisan migrate --force"

  # Storage symlink (idempotent)
  - "php artisan storage:link"

  # Clear and rebuild caches
  - "php artisan optimize:clear"
  - "php artisan config:cache"
  - "php artisan route:cache"
  - "php artisan view:cache"
